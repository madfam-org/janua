name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**'

env:
  NODE_VERSION: '22'

jobs:
  npm-sdks:
    name: Test NPM SDKs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [typescript-sdk, react-sdk, nextjs-sdk, vue-sdk, edge]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: |
          # Always build typescript-sdk first (dependency for other SDKs)
          if [ "${{ matrix.sdk }}" != "typescript-sdk" ]; then
            echo "Building typescript-sdk dependency first..."
            cd packages/typescript-sdk && pnpm build
            cd ../..
          fi
          # Build the target SDK
          cd packages/${{ matrix.sdk }}
          pnpm build

      - name: Run tests
        run: |
          cd packages/${{ matrix.sdk }}
          pnpm test

      - name: Run linter
        run: |
          cd packages/${{ matrix.sdk }}
          pnpm lint || true

      - name: Run typecheck
        run: |
          cd packages/${{ matrix.sdk }}
          pnpm typecheck || true

      - name: Verify dist/
        run: |
          if [ ! -d "packages/${{ matrix.sdk }}/dist" ]; then
            echo "❌ dist/ directory not found"
            exit 1
          fi
          FILE_COUNT=$(find packages/${{ matrix.sdk }}/dist -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ dist/ directory is empty"
            exit 1
          fi
          echo "✅ dist/ contains $FILE_COUNT files"

  python-sdk:
    name: Test Python SDK
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.8 was dropped when the cryptography floor moved to >=50.0.0 for
        # PYSEC-2026-3552: cryptography 50 declares
        # `requires-python = "!=3.9.0,!=3.9.1,>=3.9"`, so on 3.8 pip finds no
        # candidate at all and `pip install -e .` fails at resolution -- before
        # a single test runs. Python 3.8 reached end-of-life on 2024-10-07 and
        # receives no security fixes, so pinning the SDK to a vulnerable
        # cryptography just to keep 3.8 in the matrix would defeat the advisory
        # this floor exists to close. Keep this list in sync with
        # `requires-python` and the classifiers in packages/python-sdk/pyproject.toml.
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          cd packages/python-sdk
          pip install -e .[dev]

      - name: Build distributions
        run: |
          cd packages/python-sdk
          python -m build

      - name: Check distributions
        run: |
          cd packages/python-sdk
          twine check dist/*

      - name: Run tests
        run: |
          cd packages/python-sdk
          pytest tests/ -v

      # Catches the class of breakage this job missed for months: the package
      # appearing importable only because of the source tree.
      #
      # This deliberately does NOT reuse the `pip install -e .[dev]` env above.
      # An editable install resolves `janua` back to the checkout, so
      # `janua.__file__` points at the source tree no matter how broken the
      # packaging or the declared dependencies are. Only a non-editable install
      # of the built wheel, in a venv that has nothing else in it, exercises
      # what a real consumer gets — that is how the missing pydantic[email]
      # extra was found, having been invisible from the source tree.
      - name: Verify built wheel imports as a consumer would
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/consumer-venv"
          "$RUNNER_TEMP/consumer-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/consumer-venv/bin/pip" install --quiet packages/python-sdk/dist/*.whl
          cd "$RUNNER_TEMP"   # contains no janua/, so the install is the only source
          "$RUNNER_TEMP/consumer-venv/bin/python" -c "
          import janua, pathlib
          print('janua', janua.__version__, 'from', janua.__file__)
          assert 'site-packages' in janua.__file__, 'resolved outside site-packages: ' + janua.__file__
          from janua.types import JanuaConfig, ListResponse, MFAMethod, Organization
          ListResponse[Organization](items=[], total=0, limit=10, offset=0)
          janua.JanuaClient(api_key='sk_test_ci')
          print('consumer import OK')
          "

      - name: Verify dist/
        run: |
          if [ ! -d "packages/python-sdk/dist" ]; then
            echo "❌ dist/ directory not found"
            exit 1
          fi
          WHEEL_COUNT=$(find packages/python-sdk/dist -name "*.whl" | wc -l)
          SDIST_COUNT=$(find packages/python-sdk/dist -name "*.tar.gz" | wc -l)
          if [ "$WHEEL_COUNT" -eq 0 ] || [ "$SDIST_COUNT" -eq 0 ]; then
            echo "❌ Missing wheel or sdist"
            exit 1
          fi
          echo "✅ Found $WHEEL_COUNT wheel(s) and $SDIST_COUNT sdist(s)"

  go-sdk:
    name: Test Go SDK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: |
          cd packages/go-sdk
          go mod verify
          go mod tidy
          # Check if go.mod changed
          git diff --exit-code go.mod go.sum

      - name: Build
        run: |
          cd packages/go-sdk
          go build -v ./...

      - name: Run tests
        run: |
          cd packages/go-sdk
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run linter
        # The linter IS migrated to v2 now (.golangci.yml carries `version: "2"`,
        # produced by `golangci-lint migrate`), so the action major and the linter
        # major finally agree. They did not before: a Dependabot bump carried the
        # action to v9 while this pin stayed at v1.62.2 and the comment still said
        # "stay on v6", so every run died with
        #   invalid version string 'v1.62.2', golangci-lint v1 is not supported
        #   by golangci-lint-action >= v7
        # Keep this version and the action major in step when either is bumped.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: packages/go-sdk

  flutter-sdk:
    name: Test Flutter SDK
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        flutter-version: ['3.24.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: |
          cd packages/flutter-sdk
          flutter pub get

      - name: Analyze code
        run: |
          cd packages/flutter-sdk
          flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: |
          cd packages/flutter-sdk
          flutter test || true

      - name: Verify build
        run: |
          cd packages/flutter-sdk
          # Verify package structure
          if [ ! -f "lib/janua_flutter.dart" ]; then
            echo "❌ Main library file not found"
            exit 1
          fi
          echo "✅ Flutter SDK structure verified"

  react-native-sdk:
    name: Test React Native SDK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: |
          cd packages/react-native-sdk
          pnpm build || npm run build || echo "No build script, checking source..."

      - name: Verify TypeScript definitions
        run: |
          cd packages/react-native-sdk
          if [ ! -f "src/index.d.ts" ]; then
            echo "❌ TypeScript definitions not found"
            exit 1
          fi
          echo "✅ TypeScript definitions found"

      - name: Run tests
        run: |
          cd packages/react-native-sdk
          pnpm test || npm test || echo "No test script configured"
