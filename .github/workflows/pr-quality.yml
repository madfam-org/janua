name: PR Quality Checks

# PR-only checks: code quality, frontend build validation, security scanning.
# Docker builds are handled by docker-publish.yml.
on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: "3.11"
  # Required by .npmrc to resolve @janua/* packages from npm.madfam.io.
  # Without this, pnpm install falls back to the public registry and 404s
  # on @janua/typescript-sdk (and any other private scope). Matches the
  # pattern in ci.yml / tests.yml / docs-validation.yml.
  NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

jobs:
  code-quality:
    name: Code Quality
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm typecheck

  frontend-tests-build:
    name: Frontend Tests & Build
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `continue-on-error: true` was removed deliberately. This step is the only
      # place `pnpm test:unit` runs, and with it set the job stayed green no
      # matter what the tests did -- which is how 50 frontend test files came to
      # be unrunnable without anyone noticing. test:unit now also runs
      # scripts/check-test-scripts.mjs, so a workspace that grows test files
      # without a way to run them fails here too.
      - name: Run frontend tests
        run: pnpm test:unit

      - name: Build SDK packages
        run: pnpm build:packages
        continue-on-error: true

      - name: Build frontend packages
        run: pnpm build:frontend
        continue-on-error: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: |
            apps/*/.next
            packages/*/dist

  backend-tests:
    # Disabled - consolidated into tests.yml workflow
    if: false
    name: Backend Tests
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: janua
          POSTGRES_PASSWORD: janua
          POSTGRES_DB: janua_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: public.ecr.aws/docker/library/redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for xmlsec
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev pkg-config

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run backend tests
        run: |
          cd apps/api
          # Note: Several test files are ignored because they contain stale tests
          # that don't match current implementation (class/method signatures changed).
          python -m pytest tests/ --cov=app --cov-report=xml \
            --ignore=tests/compliance/ \
            --ignore=tests/test_comprehensive_integration.py \
            --ignore=tests/test_enterprise_features.py \
            --ignore=tests/unit/test_core_database.py \
            --ignore=tests/unit/services/test_billing_service_comprehensive.py \
            --ignore=tests/unit/services/test_monitoring_service.py \
            --ignore=tests/unit/services/test_risk_assessment_comprehensive.py \
            --ignore=tests/unit/services/test_remaining_services_comprehensive.py \
            --ignore=tests/unit/services/test_jwt_service_enhanced.py \
            --ignore=tests/unit/services/test_cache.py \
            --ignore=tests/unit/services/test_monitoring_simple.py \
            --ignore=tests/unit/services/test_billing_working.py \
            --ignore=tests/unit/core/test_core_utilities_comprehensive.py \
            --ignore=tests/unit/routers/test_auth_router_comprehensive.py \
            --ignore=tests/unit/core/test_redis.py \
            --ignore=tests/unit/test_auth_real.py \
            --ignore=tests/unit/services/test_billing_simple.py \
            --ignore=tests/unit/services/test_jwt_service_complete.py \
            --ignore=tests/unit/auth/test_router.py \
            --ignore=tests/unit/test_main.py \
            --ignore=tests/unit/services/test_migration_service.py \
            --ignore=tests/unit/services/test_billing_service.py \
            --ignore=tests/unit/services/test_rbac_service_comprehensive.py \
            --ignore=tests/unit/services/test_audit_logger_comprehensive.py \
            --ignore=tests/unit/services/test_compliance_service_comprehensive.py \
            --ignore=tests/unit/services/test_auth_working.py \
            --ignore=tests/unit/routers/test_passkey_router_focused.py \
            --ignore=tests/unit/middleware/test_rate_limit.py \
            --ignore=tests/unit/test_auth_working.py \
            --ignore=tests/unit/services/test_auth_service_sessions.py \
            --ignore=tests/unit/services/test_auth_service_comprehensive.py \
            --ignore=tests/unit/routers/test_auth_router_focused.py \
            --ignore=tests/unit/test_middleware_security.py \
            --ignore=tests/unit/test_core_config.py \
            --ignore=tests/unit/test_core_additional.py \
            --ignore=tests/unit/services/test_jwt_service_additional.py \
            --ignore=tests/unit/routers/test_v1_router_comprehensive.py \
            --ignore=tests/unit/routers/test_mfa_passkey_comprehensive.py \
            --ignore=tests/unit/middleware/test_rate_limit_working.py \
            --ignore=tests/unit/test_services_base.py \
            --ignore=tests/unit/test_routers_auth.py \
            --ignore=tests/unit/test_routers_admin.py \
            --ignore=tests/unit/test_core_models.py \
            --ignore=tests/unit/test_config.py \
            --ignore=tests/unit/services/test_monitoring_working.py \
            --ignore=tests/unit/services/test_email_service_comprehensive.py \
            --ignore=tests/unit/services/test_distributed_session_manager.py \
            --ignore=tests/unit/routers/test_mfa_router_comprehensive.py \
            --ignore=tests/unit/models/test_user.py \
            --ignore=tests/unit/core/test_redis_circuit_breaker.py
        env:
          DATABASE_URL: postgresql://janua:janua@localhost:5432/janua_test
          REDIS_URL: redis://localhost:6379/0
          JANUA_ENV: test
          JWT_SECRET_KEY: test-secret-key
          JWT_ALGORITHM: HS256

  security-scan:
    name: Security Scan
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` alone conflates two outcomes that need different responses:
      # "a CRITICAL advisory exists" and "the audit could not run". Both exit
      # non-zero, so the job reported a critical vulnerability while producing NO
      # output at all -- pnpm 10.25 crashes parsing the registry's audit response
      # ("Unexpected token ... is not valid JSON"), and the crash reads exactly
      # like a finding. Verified 2026-07-26: `trivy fs --severity CRITICAL` on
      # this tree reports 0, while this step failed on three consecutive runs and
      # emitted nothing after ##[endgroup]. Someone would have gone looking for a
      # vulnerability that does not exist.
      #
      # This keeps the gate FAILING in both cases -- a security check that cannot
      # run must never read as green -- but makes the two distinguishable, and
      # retries once first, since the underlying fault is a transient response
      # the registry sometimes returns.
      - name: Run pnpm audit
        # `shell:` is spelled out because the GitHub default is `bash -e`, and -e
        # kills this script at the first capture — the failure it exists to
        # classify. The first version of this step lost to exactly that: it died
        # on line 4 and emitted none of its own diagnostics, so it looked
        # identical to the bug it was fixing.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail

          # Output goes to a FILE, not a variable. pnpm's crash output contains a
          # NUL byte; `$(...)` drops it with a "ignored null byte in input"
          # warning and can mangle what is left, so the crash signature must be
          # matched on bytes as written.
          run_audit() { pnpm audit --audit-level=critical >audit.log 2>&1; }
          crashed() { grep -qa 'is not valid JSON' audit.log; }

          run_audit; code=$?
          if [ "$code" -ne 0 ] && crashed; then
            echo "::notice::pnpm audit crashed parsing the registry response; retrying once."
            sleep 10
            run_audit; code=$?
          fi

          cat audit.log

          if [ "$code" -eq 0 ]; then
            echo "Audit ran and found no advisories at or above 'critical'."
            exit 0
          fi

          if crashed; then
            echo "::error title=Audit did not run::pnpm audit CRASHED and reported nothing. This is NOT a vulnerability finding -- do not go looking for one. The tool failed to parse the registry response (pnpm 10.25). Re-run the job; if it persists, audit with an independent scanner before assuming the tree is clean."
            exit 1
          fi

          echo "::error title=Critical advisory::pnpm audit reported an advisory at 'critical'. See the output above."
          exit 1

  security-scanning:
    name: Security Scanning
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master (2026-09-23)
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # Code Scanning must be enabled in repo settings
        with:
          sarif_file: "trivy-results.sarif"

  smoke-tests:
    name: Smoke Tests
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    needs: [frontend-tests-build]  # backend-tests disabled, consolidated into tests.yml

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add actual smoke tests here when available
          echo "Smoke tests placeholder - will be implemented"
        continue-on-error: true
