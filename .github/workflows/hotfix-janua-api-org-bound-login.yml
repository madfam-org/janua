# Owner exception: build, verify and sign a janua-api image that is the image
# production runs plus janua#795 (org-bound clients sign in platform-pool
# members of their own organization).
# See deployment/hotfix/janua-api-org-bound-login/README.md.
#
# It builds ONE image and writes nothing to staging, production or this
# repository. Pinning the result in production is a separate reviewed PR. The
# promotion hold (scripts/staging/promotion_runtime_guard.py) is untouched.
# Delete this workflow and that folder once a normal promotion replaces the
# hotfix in production.

name: Hotfix image (org-bound login for platform members)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why build it now (shown in the run summary; required)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing via OIDC

concurrency:
  group: hotfix-janua-api-org-bound-login
  cancel-in-progress: false

env:
  # The digest production runs (k8s/overlays/production/kustomization.yaml on
  # 2026-11-13, pinned by janua#794): BASE_SOURCE plus the two
  # reserved-boundaries files at RESERVED_SOURCE plus the two ChatGPT files at
  # CHATGPT_SOURCE (run 43345492945).
  BASE_IMAGE: ghcr.io/madfam-org/janua-api@sha256:ae28948d88cbd9dcb0ee3795ec881e9c8ddbb7e68103b0c83f937e3d003926e4
  BASE_SOURCE: b16869d75bf8e91967b3f8443032f01bc2463417
  RESERVED_SOURCE: ee7668b894a6445c78a37bb5f5eea9183988777c
  CHATGPT_SOURCE: ae7a3f504e1965002148fb7f8e86c0a36b5e5922
  HOTFIX_DIR: deployment/hotfix/janua-api-org-bound-login
  DOCKERFILE: deployment/hotfix/janua-api-org-bound-login/Dockerfile
  POLICY_DUMP: deployment/hotfix/janua-api-map-chatgpt/dump_policy.py
  TARGET: ghcr.io/madfam-org/janua-api

jobs:
  build:
    name: Build, verify and sign
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Build the hotfix from main only, where the Dockerfile and the change were reviewed."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the three source commits must be reachable

      - name: Dockerfile pins the base this workflow verifies
        run: |
          set -euo pipefail
          grep -qxF "FROM ${BASE_IMAGE}" "$DOCKERFILE" || {
            echo "::error::$DOCKERFILE does not start FROM ${BASE_IMAGE}."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      # Proves the base is what production runs: apps/api/app at BASE_SOURCE
      # with the reserved-boundaries and ChatGPT files from their sources.
      - name: Base image is BASE_SOURCE plus the earlier hotfix files
        run: |
          set -euo pipefail
          mkdir -p /tmp/hotfix/src /tmp/hotfix/base
          docker pull --quiet "$BASE_IMAGE"
          cid=$(docker create "$BASE_IMAGE")
          docker cp "$cid:/app/app" /tmp/hotfix/base/app
          docker rm "$cid" >/dev/null
          git archive "$BASE_SOURCE" apps/api/app | tar -x -C /tmp/hotfix/src
          for f in core/oauth_metadata.py core/reserved_oauth_boundaries.py; do
            git show "$RESERVED_SOURCE:apps/api/app/$f" > "/tmp/hotfix/src/apps/api/app/$f"
          done
          for f in core/protected_resources.py services/client_id_metadata.py; do
            git show "$CHATGPT_SOURCE:apps/api/app/$f" > "/tmp/hotfix/src/apps/api/app/$f"
          done
          diff -r -x __pycache__ /tmp/hotfix/src/apps/api/app /tmp/hotfix/base/app
          echo "Base image application code matches its proven sources."

      # Proves the reviewed files differ from production's only by janua#795.
      - name: The copied files changed only in janua#795 since production's source
        run: |
          set -euo pipefail
          for f in auth/tenant_login_context.py auth/hosted_security.py; do
            cmp <(git show "$BASE_SOURCE:apps/api/app/$f") "/tmp/hotfix/base/app/$f"
            commits=$(git log --format=%H "$BASE_SOURCE..HEAD" -- "apps/api/app/$f")
            if [[ "$commits" != "6f3b9b1afcfb988c4383619ce3c9325389e748b0" ]]; then
              echo "::error::apps/api/app/$f changed outside janua#795: $commits"
              exit 1
            fi
          done

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.TARGET }}:hotfix-org-bound-login-${{ github.sha }}
          provenance: false
          sbom: false

      # Proves the delta: two added layers, and exactly the two copied files
      # changed, each byte-identical to the reviewed source on main.
      - name: Hotfix differs from the base by two files
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          new="${TARGET}@${DIGEST}"
          docker pull --quiet "$new"
          base_layers=$(docker image inspect -f '{{len .RootFS.Layers}}' "$BASE_IMAGE")
          new_layers=$(docker image inspect -f '{{len .RootFS.Layers}}' "$new")
          if [[ "$new_layers" -ne $((base_layers + 2)) ]]; then
            echo "::error::Expected exactly two added layers ($base_layers -> $new_layers)."
            exit 1
          fi
          mkdir -p /tmp/hotfix/new
          cid=$(docker create "$new")
          docker cp "$cid:/app/app" /tmp/hotfix/new/app
          docker rm "$cid" >/dev/null
          changed=$(diff -rq -x __pycache__ /tmp/hotfix/base/app /tmp/hotfix/new/app | sort || true)
          expected=$(printf '%s\n' \
            "Files /tmp/hotfix/base/app/auth/hosted_security.py and /tmp/hotfix/new/app/auth/hosted_security.py differ" \
            "Files /tmp/hotfix/base/app/auth/tenant_login_context.py and /tmp/hotfix/new/app/auth/tenant_login_context.py differ" | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected application-code delta:"
            echo "$changed"
            exit 1
          fi
          cmp /tmp/hotfix/new/app/auth/tenant_login_context.py apps/api/app/auth/tenant_login_context.py
          cmp /tmp/hotfix/new/app/auth/hosted_security.py apps/api/app/auth/hosted_security.py
          echo "Only auth/tenant_login_context.py and auth/hosted_security.py changed, and they are the reviewed files."

      # Importing app modules imports the whole application, so these also prove
      # both images import cleanly. The production image has asyncpg but not
      # the test-only aiosqlite, so the URL must be PostgreSQL; nothing listens
      # on it and nothing connects.
      - name: Discovery and client policy unchanged; login gains the platform fallback
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          run_py() {
            docker run --rm -i --entrypoint python \
              -e ENVIRONMENT=test \
              -e DATABASE_URL='postgresql+asyncpg://verify:verify@127.0.0.1:5432/verify' \
              -e REDIS_URL='redis://localhost:6379/0' \
              -e SECRET_KEY=hotfix-verification-only \
              -e JWT_SECRET_KEY=hotfix-verification-only \
              -e CORS_ORIGINS=http://localhost:3000 \
              -e JANUA_CUSTOM_DOMAIN=auth.madfam.io \
              "$@"
          }
          metadata() {
            run_py "$1" -c 'import json; from app.core.oauth_metadata import authorization_server_metadata as m; print("METADATA=" + json.dumps(m(), sort_keys=True))' \
              | grep '^METADATA=' | tail -1 | cut -d= -f2-
          }
          policy() {
            run_py "$1" - < "$POLICY_DUMP" | grep '^POLICY=' | tail -1 | cut -d= -f2-
          }
          login() {
            run_py "$1" - < "$HOTFIX_DIR/check_login.py" | grep '^LOGIN=' | tail -1 | cut -d= -f2-
          }
          new="${TARGET}@${DIGEST}"
          metadata "$BASE_IMAGE" > /tmp/hotfix/base-metadata.json
          metadata "$new" > /tmp/hotfix/new-metadata.json
          cmp /tmp/hotfix/base-metadata.json /tmp/hotfix/new-metadata.json
          echo "Discovery: identical."
          policy "$BASE_IMAGE" > /tmp/hotfix/base-policy.json
          policy "$new" > /tmp/hotfix/new-policy.json
          cmp /tmp/hotfix/base-policy.json /tmp/hotfix/new-policy.json
          echo "Client policy: identical."
          base_login=$(login "$BASE_IMAGE")
          new_login=$(login "$new")
          echo "base: $base_login"
          echo "new:  $new_login"
          python3 - "$base_login" "$new_login" <<'PY'
          import json, sys
          base, new = (json.loads(a) for a in sys.argv[1:3])
          assert base["membership_gate"] and new["membership_gate"], "membership gate missing"
          assert not base["platform_fallback"], "base already has the fallback: wrong base"
          assert all(new.values()), f"hotfix lacks part of janua#795: {new}"
          print("Login: platform-member fallback present, membership gate kept.")
          PY

      # Same retry as docker-publish.yml: a lost signature once cost a deploy.
      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${TARGET}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE_REF}"; then
              echo "Signed ${IMAGE_REF}"
              exit 0
            fi
            wait=$((attempt * 15))
            echo "::warning::cosign sign failed for ${IMAGE_REF}; retrying in ${wait}s..."
            sleep "$wait"
          done
          echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
          exit 1

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Org-bound login for platform members: hotfix image"
            echo ""
            echo "- Digest: \`${DIGEST}\`"
            echo "- Tag: \`${TARGET}:hotfix-org-bound-login-${GITHUB_SHA}\`"
            echo "- Source (main): \`${GITHUB_SHA}\`"
            echo "- Base: \`${BASE_IMAGE}\` (production, janua#794)"
            echo "- Delta: \`app/auth/tenant_login_context.py\` and \`app/auth/hosted_security.py\` only (janua#795)"
            echo "- Reason: ${REASON}"
            echo ""
            echo "Nothing was pinned. Production changes only through the reviewed PR that sets this digest as the production janua-api pin."
          } >> "$GITHUB_STEP_SUMMARY"
