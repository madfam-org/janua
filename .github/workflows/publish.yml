name: Publish Packages (retired)

# No build, version bump, publication, tag, release, or repository mutation.
# Retained only to fail clearly for callers of the former bulk publisher.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Use the canonical SDK release workflow
        run: |
          echo "::error::This bulk publisher is retired. Use publish-sdks.yml with an allowlisted package and its committed manifest version."
          exit 1
