name: Publish SDKs

# Canonical SDK publishing workflow for all Janua SDKs
# Triggered by tags following the pattern: <sdk-name>-v<version>
# Example: react-sdk-v0.1.0, core-v0.1.0, ui-v0.1.0

on:
  workflow_dispatch:
    inputs:
      sdk_name:
        description: "Package directory name (e.g. cli, react-sdk)"
        required: true
        type: string
      version:
        description: "Semver already in package.json (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "typescript-sdk-v*"
      - "react-sdk-v*"
      - "nextjs-sdk-v*"
      - "vue-sdk-v*"
      - "react-native-sdk-v*"
      - "core-v*"
      - "ui-v*"
      - "jwt-utils-v*"
      - "edge-v*"
      - "cli-v*"
      - "feature-flags-v*"
      - "python-sdk-v*"
      - "go-sdk/v*"
      - "flutter-sdk-v*"

jobs:
  publish-npm:
    name: Publish NPM SDK
    concurrency:
      group: sdk-publish-npm
      cancel-in-progress: false
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    permissions:
      contents: write
    env:
      NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/typescript-sdk-v') ||
      startsWith(github.ref, 'refs/tags/react-sdk-v') ||
      startsWith(github.ref, 'refs/tags/nextjs-sdk-v') ||
      startsWith(github.ref, 'refs/tags/vue-sdk-v') ||
      startsWith(github.ref, 'refs/tags/react-native-sdk-v') ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/ui-v') ||
      startsWith(github.ref, 'refs/tags/jwt-utils-v') ||
      startsWith(github.ref, 'refs/tags/edge-v') ||
      startsWith(github.ref, 'refs/tags/cli-v') ||
      startsWith(github.ref, 'refs/tags/feature-flags-v')

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://npm.madfam.io"

      - name: Validate package and requested version
        id: extract
        env:
          SDK_NAME: ${{ inputs.sdk_name }}
          SDK_VERSION: ${{ inputs.version }}
        run: node scripts/sdk-release.mjs validate

      - name: Verify release contract regressions
        run: node --test scripts/sdk-release.test.mjs

      - name: Authenticate to npm.madfam.io
        uses: madfam-org/solarpunk-foundry/.github/actions/npm-madfam-auth@2ab1074779f04e6bd474bc3a41eece197b1d9a2e # main (2026-09-23)
        with:
          token: ${{ secrets.NPM_MADFAM_TOKEN }}

      - name: Require unpublished version
        env:
          SDK_NAME: ${{ steps.extract.outputs.sdk_name }}
          SDK_VERSION: ${{ steps.extract.outputs.version }}
        run: node scripts/sdk-release.mjs registry

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package and workspace dependencies
        env:
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: pnpm --filter "$PACKAGE_NAME..." --fail-if-no-match --workspace-concurrency=1 -r --if-present run build

      - name: Run package tests
        env:
          CI: "true"
          PACKAGE_NAME: ${{ steps.extract.outputs.package_name }}
        run: pnpm --filter "$PACKAGE_NAME" --fail-if-no-match test

      - name: Pack and inspect publishable manifest
        id: pack
        env:
          SDK_NAME: ${{ steps.extract.outputs.sdk_name }}
          SDK_VERSION: ${{ steps.extract.outputs.version }}
        run: node scripts/sdk-release.mjs pack

      - name: Publish exact inspected tarball
        env:
          SDK_NAME: ${{ steps.extract.outputs.sdk_name }}
          SDK_VERSION: ${{ steps.extract.outputs.version }}
          RELEASE_MANIFEST: ${{ steps.pack.outputs.release_manifest }}
        run: node scripts/sdk-release.mjs publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.extract.outputs.package_name }} v${{ steps.extract.outputs.version }}
          body: |
            Release `${{ steps.extract.outputs.package_name }}@${{ steps.extract.outputs.version }}`.

            Install from the MADFAM registry:
            ```bash
            npm install ${{ steps.extract.outputs.package_name }}@${{ steps.extract.outputs.version }} --registry https://npm.madfam.io
            ```

            Built and tested with its workspace dependencies. Published from the inspected pnpm tarball at this commit.
          draft: false
          prerelease: ${{ steps.extract.outputs.prerelease == 'true' }}

  publish-python:
    name: Publish Python SDK
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/python-sdk-v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Extract version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#python-sdk-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: |
          cd packages/python-sdk
          python -m build

      - name: Check distributions
        run: |
          cd packages/python-sdk
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd packages/python-sdk
          twine upload --repository pypi dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Python SDK v${{ steps.extract.outputs.version }}
          body: |
            Release ${{ steps.extract.outputs.version }} of Python SDK

            ## Installation
            ```bash
            pip install janua==${{ steps.extract.outputs.version }}
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/packages/python-sdk/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ contains(steps.extract.outputs.version, 'alpha') || contains(steps.extract.outputs.version, 'beta') || contains(steps.extract.outputs.version, 'rc') }}

  publish-go:
    name: Publish Go SDK
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/go-sdk/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Extract version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#go-sdk/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify Go module
        run: |
          cd packages/go-sdk
          go mod verify
          go mod tidy

      - name: Run tests
        run: |
          cd packages/go-sdk
          go test -v -race ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Go SDK ${{ steps.extract.outputs.version }}
          body: |
            Release ${{ steps.extract.outputs.version }} of Go SDK

            ## Installation
            ```bash
            go get github.com/${{ github.repository }}/packages/go-sdk@${{ steps.extract.outputs.version }}
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/packages/go-sdk/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ contains(steps.extract.outputs.version, 'alpha') || contains(steps.extract.outputs.version, 'beta') || contains(steps.extract.outputs.version, 'rc') }}

  publish-flutter:
    name: Publish Flutter SDK
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/flutter-sdk-v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Extract version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#flutter-sdk-v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get dependencies
        run: |
          cd packages/flutter-sdk
          flutter pub get

      - name: Analyze code
        run: |
          cd packages/flutter-sdk
          flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          cd packages/flutter-sdk
          flutter test || true

      - name: Update version in pubspec.yaml
        run: |
          cd packages/flutter-sdk
          sed -i "s/^version: .*/version: ${{ steps.extract.outputs.version }}/" pubspec.yaml

      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          cd packages/flutter-sdk
          if [ -n "$PUB_CREDENTIALS" ]; then
            mkdir -p ~/.config/dart
            echo "$PUB_CREDENTIALS" > ~/.config/dart/pub-credentials.json
            flutter pub publish --force
          else
            echo "PUB_CREDENTIALS not set, skipping pub.dev publish"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flutter SDK v${{ steps.extract.outputs.version }}
          body: |
            Release ${{ steps.extract.outputs.version }} of Flutter SDK

            ## Installation
            ```yaml
            # pubspec.yaml
            dependencies:
              janua_flutter: ^${{ steps.extract.outputs.version }}
            ```

            Or install via CLI:
            ```bash
            flutter pub add janua_flutter
            ```

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/packages/flutter-sdk/CHANGELOG.md) for details.
          draft: false
          prerelease: ${{ contains(steps.extract.outputs.version, 'alpha') || contains(steps.extract.outputs.version, 'beta') || contains(steps.extract.outputs.version, 'rc') }}
