# PP.3c (RFC 0001 Phase 2) — emergency prod rollback.
#
# Writes a target digest into k8s/overlays/production/kustomization.yaml
# and commits. ArgoCD reconciles within ~3 min. Intended RTO <5 min.
#
# There is no auto-trigger — rollbacks are always a human call. Per
# RFC 0001, leaving `digest` blank rolls back to the previous prod
# digest for the chosen component by reading git history.
#
# Rollback only goes back. An explicit `digest` must be one production
# has already run: it must have been this component's digest in the
# production overlay at some point in main's first-parent history.
# Anything else is a new image, and new images reach production only
# through promote-to-prod.yml and its guards (including the isolated-
# staging hold, scripts/staging/promotion_runtime_guard.py). Without
# this check, rollback was a way to roll forward around those guards.
#
# Janua-specific operator note:
#   Rollbacks share the `prod-promote` concurrency group with promotes
#   to serialize prod-touching writes. If a JWT keypair rotation is in
#   flight when you need to roll back, the safer path is: let the
#   rotation complete (its commit lands), THEN roll back to the target
#   digest. Rolling back across a key-rotation boundary can orphan
#   in-flight tokens — coordinate via the #incident channel.
#
# Target file note:
#   Rolls back via k8s/overlays/production/kustomization.yaml (post
#   PP.3b canonical path). Until PP.3b lands, this workflow fails fast
#   with a helpful error.

name: Rollback prod

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Which image to roll back"
        required: true
        type: choice
        options:
          - api
          - admin
          - dashboard
          - docs
          - website
      digest:
        description: "Digest to roll back to (sha256:...). Must be a digest production has run before (production overlay history on main). Leave blank to use the previous prod digest from git history."
        required: false
        type: string
      reason:
        description: "Why are you rolling back? (shown in audit log; required)"
        required: true
        type: string
      rollback_ack:
        description: "Type rollback to acknowledge this mutates production identity GitOps state"
        required: true
        type: string

concurrency:
  group: prod-promote
  cancel-in-progress: false

jobs:
  rollback:
    name: Write target digest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.MADFAM_BOT_PAT || secrets.GITHUB_TOKEN }}
          # Full history: the target check below reads every version of the
          # production overlay on main. A shallow clone would silently forget
          # older production digests and refuse a legitimate rollback.
          fetch-depth: 0

      - name: Require rollback acknowledgement
        env:
          ROLLBACK_ACK: ${{ inputs.rollback_ack }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$ROLLBACK_ACK" != "rollback" ]; then
            echo "Production rollback requires rollback_ack=rollback" >&2
            exit 1
          fi
          if [ ${#REASON} -lt 12 ]; then
            echo "Production rollback requires a reason of at least 12 characters" >&2
            exit 1
          fi
      - name: Resolve target digest
        id: target
        env:
          COMPONENT: ${{ inputs.component }}
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          FILE="k8s/overlays/production/kustomization.yaml"
          if [[ ! -f "$FILE" ]]; then
            echo "::error::$FILE does not exist. PP.3b must land first — rollback target path is the post-PP.3b canonical overlay."
            exit 1
          fi
          IMAGE="ghcr.io/madfam-org/janua-$COMPONENT"

          if [[ -n "$INPUT_DIGEST" ]]; then
            TARGET="$INPUT_DIGEST"
          else
            CURRENT_DIGEST=$(python3 - "$IMAGE" <<'PY'
          import re, pathlib, sys
          image = sys.argv[1]
          t = pathlib.Path("k8s/overlays/production/kustomization.yaml").read_text()
          pat = r'name:\s+' + re.escape(image) + r'\s*\n(?:\s+newName:[^\n]+\n)?\s+digest:\s+(sha256:[a-f0-9]+)'
          m = re.search(pat, t)
          if not m:
              alt = r'digest:\s+(sha256:[a-f0-9]+)\s*\n\s+name:\s+' + re.escape(image)
              m = re.search(alt, t)
          if m: print(m.group(1))
          PY
          )
            if [[ -z "$CURRENT_DIGEST" ]]; then
              echo "::error::Could not read current prod digest for $COMPONENT ($IMAGE)"; exit 1
            fi
            # Walk git log; find first historical version where the digest
            # for this component differed from current.
            #
            # Each historical version goes through a temp FILE, not a pipe:
            # `python3 -` already reads its program from the heredoc on stdin,
            # so a piped `git show | python3 - <<'PY'` is silently dropped by
            # bash -- sys.stdin.read() was always '' and git show then died of
            # SIGPIPE under pipefail (exit 141, no message).
            TARGET=""
            HIST_FILE="$(mktemp)"
            trap 'rm -f "$HIST_FILE"' EXIT
            for sha in $(git log -n 40 --format=%H -- "$FILE"); do
              # A commit that deleted the file has no version to read; skip it.
              git show "$sha:$FILE" > "$HIST_FILE" 2>/dev/null || continue
              HIST=$(python3 - "$IMAGE" "$HIST_FILE" <<'PY'
          import re, sys, pathlib
          image = sys.argv[1]
          t = pathlib.Path(sys.argv[2]).read_text()
          pat = r'name:\s+' + re.escape(image) + r'\s*\n(?:\s+newName:[^\n]+\n)?\s+digest:\s+(sha256:[a-f0-9]+)'
          m = re.search(pat, t)
          if not m:
              alt = r'digest:\s+(sha256:[a-f0-9]+)\s*\n\s+name:\s+' + re.escape(image)
              m = re.search(alt, t)
          if m: print(m.group(1))
          PY
          )
              if [[ -n "$HIST" && "$HIST" != "$CURRENT_DIGEST" ]]; then
                TARGET="$HIST"
                break
              fi
            done
            if [[ -z "$TARGET" ]]; then
              echo "::error::Cannot find previous $COMPONENT digest. Pass one explicitly."; exit 1
            fi
          fi

          if [[ ! "$TARGET" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid digest: $TARGET"; exit 1
          fi

          # Rollback restores an image production has already run. It never
          # introduces one: new images reach production only through
          # promote-to-prod.yml and its guards. So the target must have been
          # THIS component's digest in the production overlay in some commit
          # of main's first-parent history -- the states main itself has held.
          # Three things deliberately do not count:
          #   - the dispatch ref, when it is not main (it may carry an overlay
          #     edit that never landed), hence the fresh fetch of main;
          #   - side-branch commits that a merge brought in but main's tip
          #     never held (--first-parent);
          #   - another component's digest, or a staging-only digest.
          # The blank-digest path above passes through here too; it already
          # picks from this history, so for it the check is a no-op.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          SEEN_AT=$(python3 - "$IMAGE" "$TARGET" "$FILE" <<'PY'
          import re, subprocess, sys
          image, target, path = sys.argv[1:4]
          ref = "refs/remotes/origin/main"
          e = re.escape(image)
          patterns = (
              r'name:\s+' + e + r'[ \t]*\n(?:[ \t]+newName:\s+' + e + r'[ \t]*\n)?[ \t]+digest:\s+(sha256:[a-f0-9]+)',
              r'digest:\s+(sha256:[a-f0-9]+)[ \t]*\n[ \t]+name:\s+' + e + r'[ \t]*(?:\n|$)',
          )
          log = subprocess.run(
              ["git", "log", "--first-parent", "--format=%H", ref, "--", path],
              capture_output=True, text=True, check=True,
          )
          commits = log.stdout.split()
          for sha in commits:  # newest first
              shown = subprocess.run(["git", "show", f"{sha}:{path}"], capture_output=True, text=True)
              if shown.returncode != 0:
                  continue  # a commit that deleted the file has no version to read
              if any(target in re.findall(p, shown.stdout) for p in patterns):
                  print(sha)
                  sys.exit(0)
          print(
              f"::error::{target} was never the production digest for {image} on main "
              f"(checked {len(commits)} versions of {path}). Rollback only restores an "
              "image production has already run; a new image must go through promote-to-prod.yml.",
              file=sys.stderr,
          )
          sys.exit(1)
          PY
          )
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Rolling back $COMPONENT to $TARGET (last pinned in the production overlay at $SEEN_AT)"

      - name: Patch prod kustomization
        env:
          TARGET: ${{ steps.target.outputs.target }}
          COMPONENT: ${{ inputs.component }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          FILE="k8s/overlays/production/kustomization.yaml"

          # Why this patches a FRESH origin/main instead of the checkout:
          # actions/checkout pins this job to the dispatch-time github.sha, and
          # the prod-promote concurrency group makes a rollback queue behind a
          # promote that then pushes -- so a push from the stale checkout is
          # rejected with "fetch first" (same race as promote-to-prod.yml,
          # 2026-09-27 run 36313882945). Every attempt re-fetches main and
          # re-applies ONLY the TARGET the step above already resolved; it
          # never re-resolves the target from the newer main.
          patch_prod() {
            python3 <<'PY'
          import os, re, pathlib, sys
          p = pathlib.Path("k8s/overlays/production/kustomization.yaml")
          t = p.read_text()
          target = os.environ["TARGET"]
          comp = os.environ["COMPONENT"]
          image = f"ghcr.io/madfam-org/janua-{comp}"
          pat = (
              r'(name:\s+' + re.escape(image)
              + r'\s*\n\s+(?:newName:\s+' + re.escape(image) + r'\s*\n\s+)?digest:\s+)sha256:[a-f0-9]+'
          )
          alt = (
              r'(digest:\s+)sha256:[a-f0-9]+(\s*\n\s+name:\s+' + re.escape(image) + r')'
          )
          # Presence is decided by the match count, never by comparing text:
          # an entry already at TARGET still counts as found.
          t, n = re.subn(pat, lambda m: m.group(1) + target, t)
          if n == 0:
              t, n = re.subn(alt, lambda m: m.group(1) + target + m.group(2), t)
          if n == 0:
              print(f"::error::Could not locate {comp} ({image}) digest entry in {p}")
              sys.exit(1)
          p.write_text(t)
          PY
          }

          SHORT="${TARGET:7:15}"
          git config user.name "madfam-deploy-bot"
          git config user.email "deploy-bot@madfam.io"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main

            if [[ ! -f "$FILE" ]]; then
              echo "::error::$FILE does not exist. PP.3b must land first — rollback target path is the post-PP.3b canonical overlay."
              exit 1
            fi

            patch_prod
            git add "$FILE"
            # Unchanged guard: rolling back to the digest main already runs
            # is a mistake, and `git commit` fails the step as it always has.
            git commit -m "rollback(prod): restore $COMPONENT $SHORT

          Reason: $REASON
          Rolled-back-by: $ACTOR"

            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              echo "::warning::Push rejected (attempt $attempt/$MAX_ATTEMPTS) — main moved under us; re-fetching and re-applying rollback target $TARGET."
              sleep $(( attempt * 3 ))
            fi
          done
          echo "::error::Could not push the rollback after $MAX_ATTEMPTS attempts — main kept moving. Nothing was rolled back; re-dispatch once main is quiet."
          exit 1

      - name: Notify
        if: always()
        # always() so an operator mid-incident gets a verdict either way --
        # but the verdict must match what happened. job.status is the status
        # of the steps before this one. On failure the push (the write step's
        # last command) never succeeded, so nothing reached main; a
        # cancellation can interrupt at any point, so it claims neither.
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "::notice::Janua ${{ inputs.component }} rolled back to ${{ steps.target.outputs.target }}. Monitor ArgoCD (janua Application) for reconcile completion. RTO target <5min."
          elif [[ "${{ job.status }}" == "cancelled" ]]; then
            echo "::notice::Janua ${{ inputs.component }} rollback was CANCELLED — whether it landed is unknown. Check main for a rollback(prod) commit before re-dispatching."
          elif [[ -z "${{ steps.target.outputs.target }}" ]]; then
            echo "::notice::Janua ${{ inputs.component }} rollback FAILED (${{ job.status }}) — it did NOT land: no target digest was resolved (acknowledgement, reason or target resolution failed; see the failed step above). Production is unchanged."
          else
            echo "::notice::Janua ${{ inputs.component }} rollback to ${{ steps.target.outputs.target }} FAILED (${{ job.status }}) — it did NOT land: writing or pushing the prod kustomization failed (see the failed step above). Production is unchanged."
          fi
