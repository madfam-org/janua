# Owner exception: build, verify and sign a janua-api image that is the image
# production runs plus janua#801 and janua#802 (an organization role is never
# published as an application role).
# See deployment/hotfix/janua-api-org-role-shape/README.md.
#
# It builds ONE image and writes nothing to staging, production or this
# repository. Pinning the result in production is a separate reviewed PR. The
# promotion hold (scripts/staging/promotion_runtime_guard.py) is untouched.
# Delete this workflow and that folder once a normal promotion replaces the
# hotfix in production.

name: Hotfix image (organization roles never read as application roles)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why build it now (shown in the run summary; required)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing via OIDC

concurrency:
  group: hotfix-janua-api-org-role-shape
  cancel-in-progress: false

env:
  # The digest production runs (k8s/overlays/production/kustomization.yaml on
  # 2026-11-15, pinned by janua#797): BASE_SOURCE plus the two
  # reserved-boundaries files at RESERVED_SOURCE, the two ChatGPT files at
  # CHATGPT_SOURCE and the two org-bound-login files at ORG_LOGIN_SOURCE
  # (run 43524028111).
  BASE_IMAGE: ghcr.io/madfam-org/janua-api@sha256:f97bddd83a8091ed17c9c33d8ee36577406afefa902c35cd8e42c2f7dff8326e
  BASE_SOURCE: b16869d75bf8e91967b3f8443032f01bc2463417
  RESERVED_SOURCE: ee7668b894a6445c78a37bb5f5eea9183988777c
  CHATGPT_SOURCE: ae7a3f504e1965002148fb7f8e86c0a36b5e5922
  ORG_LOGIN_SOURCE: 6f3b9b1afcfb988c4383619ce3c9325389e748b0
  # The two reviewed changes this hotfix ships (janua#801, janua#802).
  ROLE_SHAPE_801: 4bacd0b9846f5ee4b8d862ca4cc8f41d17ca03f4
  ROLE_SHAPE_802: 508d19099a75b2c71ac9bd0eba1435cdc011b150
  HOTFIX_DIR: deployment/hotfix/janua-api-org-role-shape
  DOCKERFILE: deployment/hotfix/janua-api-org-role-shape/Dockerfile
  POLICY_DUMP: deployment/hotfix/janua-api-map-chatgpt/dump_policy.py
  TARGET: ghcr.io/madfam-org/janua-api

jobs:
  build:
    name: Build, verify and sign
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Build the hotfix from main only, where the Dockerfile and the change were reviewed."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every source commit must be reachable

      - name: Dockerfile pins the base this workflow verifies
        run: |
          set -euo pipefail
          grep -qxF "FROM ${BASE_IMAGE}" "$DOCKERFILE" || {
            echo "::error::$DOCKERFILE does not start FROM ${BASE_IMAGE}."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      # Proves the base is what production runs: apps/api/app at BASE_SOURCE
      # with the reserved-boundaries, ChatGPT and org-bound-login files from
      # their sources.
      - name: Base image is BASE_SOURCE plus the earlier hotfix files
        run: |
          set -euo pipefail
          mkdir -p /tmp/hotfix/src /tmp/hotfix/base
          docker pull --quiet "$BASE_IMAGE"
          cid=$(docker create "$BASE_IMAGE")
          docker cp "$cid:/app/app" /tmp/hotfix/base/app
          docker rm "$cid" >/dev/null
          git archive "$BASE_SOURCE" apps/api/app | tar -x -C /tmp/hotfix/src
          for f in core/oauth_metadata.py core/reserved_oauth_boundaries.py; do
            git show "$RESERVED_SOURCE:apps/api/app/$f" > "/tmp/hotfix/src/apps/api/app/$f"
          done
          for f in core/protected_resources.py services/client_id_metadata.py; do
            git show "$CHATGPT_SOURCE:apps/api/app/$f" > "/tmp/hotfix/src/apps/api/app/$f"
          done
          for f in auth/tenant_login_context.py auth/hosted_security.py; do
            git show "$ORG_LOGIN_SOURCE:apps/api/app/$f" > "/tmp/hotfix/src/apps/api/app/$f"
          done
          diff -r -x __pycache__ /tmp/hotfix/src/apps/api/app /tmp/hotfix/base/app
          echo "Base image application code matches its proven sources."

      # Proves the reviewed files differ from production's only by janua#801
      # and janua#802: production still runs each at BASE_SOURCE, and nothing
      # else has touched them since.
      - name: The copied files changed only in janua#801 and janua#802 since production's source
        run: |
          set -euo pipefail
          check() {
            local f="$1"; shift
            cmp <(git show "$BASE_SOURCE:apps/api/app/$f") "/tmp/hotfix/base/app/$f"
            local commits expected
            commits=$(git log --format=%H "$BASE_SOURCE..HEAD" -- "apps/api/app/$f" | sort)
            expected=$(printf '%s\n' "$@" | sort)
            if [[ "$commits" != "$expected" ]]; then
              echo "::error::apps/api/app/$f changed outside the reviewed commits: $commits"
              exit 1
            fi
          }
          check services/org_claims_service.py "$ROLE_SHAPE_801" "$ROLE_SHAPE_802"
          check services/role_service.py "$ROLE_SHAPE_801"
          check services/organization_member_service.py "$ROLE_SHAPE_801"
          echo "The three files are production's plus janua#801 and janua#802 only."

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.TARGET }}:hotfix-org-role-shape-${{ github.sha }}
          provenance: false
          sbom: false

      # Proves the delta: three added layers, and exactly the three copied files
      # changed, each byte-identical to the reviewed source on main.
      - name: Hotfix differs from the base by three files
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          new="${TARGET}@${DIGEST}"
          docker pull --quiet "$new"
          base_layers=$(docker image inspect -f '{{len .RootFS.Layers}}' "$BASE_IMAGE")
          new_layers=$(docker image inspect -f '{{len .RootFS.Layers}}' "$new")
          if [[ "$new_layers" -ne $((base_layers + 3)) ]]; then
            echo "::error::Expected exactly three added layers ($base_layers -> $new_layers)."
            exit 1
          fi
          mkdir -p /tmp/hotfix/new
          cid=$(docker create "$new")
          docker cp "$cid:/app/app" /tmp/hotfix/new/app
          docker rm "$cid" >/dev/null
          changed=$(diff -rq -x __pycache__ /tmp/hotfix/base/app /tmp/hotfix/new/app | sort || true)
          expected=$(printf '%s\n' \
            "Files /tmp/hotfix/base/app/services/org_claims_service.py and /tmp/hotfix/new/app/services/org_claims_service.py differ" \
            "Files /tmp/hotfix/base/app/services/organization_member_service.py and /tmp/hotfix/new/app/services/organization_member_service.py differ" \
            "Files /tmp/hotfix/base/app/services/role_service.py and /tmp/hotfix/new/app/services/role_service.py differ" | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected application-code delta:"
            echo "$changed"
            exit 1
          fi
          cmp /tmp/hotfix/new/app/services/org_claims_service.py apps/api/app/services/org_claims_service.py
          cmp /tmp/hotfix/new/app/services/role_service.py apps/api/app/services/role_service.py
          cmp /tmp/hotfix/new/app/services/organization_member_service.py apps/api/app/services/organization_member_service.py
          echo "Only the three service files changed, and they are the reviewed files."

      # Importing app modules imports the whole application, so these also prove
      # both images import cleanly. The production image has asyncpg but not
      # the test-only aiosqlite, so the URL must be PostgreSQL; nothing listens
      # on it and nothing connects.
      - name: Discovery and client policy unchanged; the roles claim drops forged strings
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          run_py() {
            docker run --rm -i --entrypoint python \
              -e ENVIRONMENT=test \
              -e DATABASE_URL='postgresql+asyncpg://verify:verify@127.0.0.1:5432/verify' \
              -e REDIS_URL='redis://localhost:6379/0' \
              -e SECRET_KEY=hotfix-verification-only \
              -e JWT_SECRET_KEY=hotfix-verification-only \
              -e CORS_ORIGINS=http://localhost:3000 \
              -e JANUA_CUSTOM_DOMAIN=auth.madfam.io \
              "$@"
          }
          metadata() {
            run_py "$1" -c 'import json; from app.core.oauth_metadata import authorization_server_metadata as m; print("METADATA=" + json.dumps(m(), sort_keys=True))' \
              | grep '^METADATA=' | tail -1 | cut -d= -f2-
          }
          policy() {
            run_py "$1" - < "$POLICY_DUMP" | grep '^POLICY=' | tail -1 | cut -d= -f2-
          }
          roles() {
            run_py "$1" - < "$HOTFIX_DIR/check_roles.py" | grep '^ROLES=' | tail -1 | cut -d= -f2-
          }
          new="${TARGET}@${DIGEST}"
          metadata "$BASE_IMAGE" > /tmp/hotfix/base-metadata.json
          metadata "$new" > /tmp/hotfix/new-metadata.json
          cmp /tmp/hotfix/base-metadata.json /tmp/hotfix/new-metadata.json
          echo "Discovery: identical."
          policy "$BASE_IMAGE" > /tmp/hotfix/base-policy.json
          policy "$new" > /tmp/hotfix/new-policy.json
          cmp /tmp/hotfix/base-policy.json /tmp/hotfix/new-policy.json
          echo "Client policy: identical."
          base_roles=$(roles "$BASE_IMAGE")
          new_roles=$(roles "$new")
          echo "base: $base_roles"
          echo "new:  $new_roles"
          python3 - "$base_roles" "$new_roles" <<'PY'
          import json, sys
          base, new = (json.loads(a) for a in sys.argv[1:3])
          assert base["grant_published"] and base["bare_roles_published"], f"base resolver is not the one expected: {base}"
          assert not base["forged_dropped_from_token"], "base already drops forged roles: wrong base"
          assert all(new.values()), f"hotfix lacks part of janua#801/#802: {new}"
          print("Roles: forged organization roles dropped, grants and bare roles kept, names checked.")
          PY

      # Same retry as docker-publish.yml: a lost signature once cost a deploy.
      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${TARGET}@${DIGEST}"
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE_REF}"; then
              echo "Signed ${IMAGE_REF}"
              exit 0
            fi
            wait=$((attempt * 15))
            echo "::warning::cosign sign failed for ${IMAGE_REF}; retrying in ${wait}s..."
            sleep "$wait"
          done
          echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
          exit 1

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Organization roles never read as application roles: hotfix image"
            echo ""
            echo "- Digest: \`${DIGEST}\`"
            echo "- Tag: \`${TARGET}:hotfix-org-role-shape-${GITHUB_SHA}\`"
            echo "- Source (main): \`${GITHUB_SHA}\`"
            echo "- Base: \`${BASE_IMAGE}\` (production, janua#797)"
            echo "- Delta: \`app/services/org_claims_service.py\`, \`app/services/role_service.py\` and \`app/services/organization_member_service.py\` only (janua#801, janua#802)"
            echo "- Reason: ${REASON}"
            echo ""
            echo "Nothing was pinned. Production changes only through the reviewed PR that sets this digest as the production janua-api pin."
          } >> "$GITHUB_STEP_SUMMARY"
