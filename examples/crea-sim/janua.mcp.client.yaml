# The registered client_id is generated by Janua; metadata.name is not that ID.
apiVersion: janua.dev/v1
kind: OAuthClient
metadata:
  name: crea-sim-mcp
spec:
  audience: crea-sim-mcp
  description: Consentimiento humano para el MCP aislado del simulador de Crea Tu Mundo
  redirect_uris:
    - https://sim.creatumundo.mx/auth/mcp/callback
  allowed_scopes:
    - map.sim:read
    - map.sim:write
    - offline_access
  grant_types:
    - authorization_code
    - refresh_token
  is_confidential: true
