apiVersion: apps/v1
kind: Deployment
metadata:
  name: janua-api
  namespace: janua
  labels:
    app: janua-api
    app.kubernetes.io/name: janua-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: janua
  annotations:
    # Prevent Switchyard from overriding our deployment
    # janua-api uses K8s secrets (janua-secrets) for env vars, NOT Switchyard's database
    enclii.dev/reconcile: "disabled"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: janua-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: janua-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: janua-api
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/madfam-org/janua-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Required - from secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: database-url
            # Direct 5432 URL for alembic when DATABASE_URL routes through
            # pgbouncer (adoption ruling, move 3). optional: true — absent
            # until the flip writes the key, and the app treats unset as
            # "use DATABASE_URL".
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: direct-database-url
                  optional: true
            # The internal service-to-service door (email send-template et al).
            # The vault value has been synced into janua-secrets all along —
            # nothing ever mapped it into the env, so settings.INTERNAL_API_KEY
            # was empty and the door answered 503 (found 2026-08-16 wiring the
            # Nauta lifecycle notifications). Optional: environments without
            # the key must still boot; the endpoints refuse per-request.
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: internal-api-key
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: jwt-secret
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: jwt-private-key
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: jwt-public-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: secret-key
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: field-encryption-key
            - name: DHANAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: dhanam-webhook-secret
            # Dhanam customer-federation checkout relay (#453). The relay
            # fails closed (503 "Billing is not configured") unless BOTH
            # DHANAM_FEDERATION_URL and FEDERATION_API_TOKEN resolve
            # (_federation_configured in checkout_dhanam.py), so the optional
            # token ref is crash-safe in envs the operator hasn't provisioned.
            - name: DHANAM_FEDERATION_URL
              value: 'https://api.dhan.am'
            - name: FEDERATION_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: federation-api-token
                  optional: true
            - name: JANUA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: janua-service-token
                  optional: true
            # Metrics auth (gates /metrics, /metrics/performance, /metrics/scalability).
            # Optional: when unset in production, /metrics* return 404 (fail-closed).
            # In-cluster Prometheus must send `Authorization: Bearer $METRICS_TOKEN`.
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: metrics-token
                  optional: true
            # Configuration
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: production
            - name: LOG_LEVEL
              value: info
            - name: BASE_URL
              value: https://auth.madfam.io
            # Frontend pages — verify-email links are built on this (PR#473).
            # Password-reset links no longer are: since 2026-08-13 they land on
            # the API's own hosted reset page (the frontend route is auth-walled).
            - name: FRONTEND_URL
              value: https://app.janua.dev
            # Product reset pages allowed to receive password-reset tokens via
            # ForgotPasswordRequest.redirect_base (comma-separated allowlist)
            - name: PASSWORD_RESET_REDIRECT_ORIGINS
              value: https://app.dhan.am/reset-password
            # Email
            - name: EMAIL_PROVIDER
              value: resend
            - name: EMAIL_FROM
              value: hola@madfam.io
            - name: EMAIL_ENABLED
              value: "true"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: resend-api-key
            # Crea Tu Mundo's OWN Resend account (option B, 2026-09-07). The CTM
            # sender binding (app/services/sender_binding.py) names this env var as
            # its credential_ref; the value comes from Vault secret/janua
            # #ctm_resend_api_key through the enclii-managed janua-secrets
            # ExternalSecret. Optional: if the key is absent the mailer falls back
            # to the platform sender (never a mixed From header).
            - name: CTM_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: ctm-resend-api-key
                  optional: true
            # SMTP transport for the real mailer (email_service.py) — Resend's
            # SMTP interface with the SAME api key as password. No new secret:
            # this is what makes password-reset email physically send (PR#473;
            # before that a placebo service logged and sent nothing).
            - name: SMTP_HOST
              value: smtp.resend.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_TLS
              value: "true"
            - name: SMTP_USERNAME
              value: resend
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: janua-secrets
                  key: resend-api-key
            - name: FROM_EMAIL
              value: hola@madfam.io
            - name: FROM_NAME
              value: MADFAM
            # Custom domain for white-label OIDC issuer (auth.madfam.io instead of api.janua.dev)
            - name: JANUA_CUSTOM_DOMAIN
              value: auth.madfam.io
            # CORS - All allowed frontend origins
            - name: CORS_ORIGINS
              # Non-core app origins auto-derived from OAuth client redirect_uris via DynamicCORSMiddleware
              value: "https://admin.janua.dev,https://app.janua.dev,https://api.enclii.dev,https://app.enclii.dev,https://admin.enclii.dev,https://auth.madfam.io,https://tezca.mx,https://admin.tezca.mx,https://www.tezca.mx,https://madfam.io,https://www.madfam.io,https://dhanam.madfam.io,https://forgesight.madfam.io,https://forgesight.app,https://www.forgesight.app,https://app.forgesight.app,https://admin.forgesight.app,https://pravara.madfam.io,https://dhan.am,https://app.dhan.am,https://rondel.io,https://fortuna.tube,https://selva.town,https://ceq.lol,https://crm.madfam.io,https://staging-crm.madfam.io,https://crea.madfam.io,https://crea-map.madfam.io,https://ensayo.madfam.io,https://ensayo-map.madfam.io,https://map.creatumundo.mx,https://erp.creatumundo.mx"
            # Cookie domain for cross-subdomain SSO (*.madfam.io for auth.madfam.io)
            - name: COOKIE_DOMAIN
              value: ".madfam.io"
            # Features
            # ENABLE_DOCS: prod-safe default (false). Dev overlay flips this on.
            # Audit 2026-04-23 H9: /docs, /redoc, /openapi.json must NOT be public
            # in prod (would enumerate all auth endpoints on auth.madfam.io).
            - name: ENABLE_DOCS
              value: "false"
            - name: ENABLE_SIGNUPS
              value: "true"
            - name: ENABLE_OAUTH
              value: "true"
            - name: ENABLE_MFA
              value: "true"
            - name: ENABLE_MAGIC_LINKS
              value: "true"
            - name: ENABLE_ORGANIZATIONS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
