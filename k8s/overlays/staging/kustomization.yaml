# Staging overlay — separate Janua tenant (RFC 0001 / PP.3b).
#
# Janua cannot use prod Janua as its staging auth provider. This overlay
# deploys a fully isolated instance: janua-staging namespace, distinct
# secrets (janua-staging-secrets), distinct JWT keys, distinct issuer URL.
#
# Image digests are updated by docker-publish.yml on every main-branch merge.
# Cloudflare tunnel routes + DNS for staging hostnames are ops-managed — see
# internal-devops/runbooks/staging-bootstrap.md and docs/PP_3_STAGING_AUDIT.md.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: janua-staging

resources:
- ../../base

replicas:
- count: 1
  name: janua-api
- count: 1
  name: janua-admin
- count: 1
  name: janua-dashboard
- count: 1
  name: janua-docs
- count: 1
  name: janua-website

# Staging image digests — CI overwrites on each main-branch push.
images:
- digest: sha256:c168efd6206a2242e396f6c5953f18fa6ed5a062f3904c05ce87742a63accf43
  name: ghcr.io/madfam-org/janua-admin
  newName: ghcr.io/madfam-org/janua-admin
- digest: sha256:ff90fc7263710a29b64a058d3b2ff6aeb7869b2be807aff8948f063e8bcad865
  name: ghcr.io/madfam-org/janua-api
  newName: ghcr.io/madfam-org/janua-api
- digest: sha256:d2afa7193069a8142f43ab98040914a269830f93acb644d06d8b95026f8c2da0
  name: ghcr.io/madfam-org/janua-dashboard
  newName: ghcr.io/madfam-org/janua-dashboard
- digest: sha256:62d2f0eea9132d2424cfef7c438897dc73109a51a430e9749e3a56de5775ab60
  name: ghcr.io/madfam-org/janua-docs
  newName: ghcr.io/madfam-org/janua-docs
- digest: sha256:401e2af12f7c13a8d191b312afefc52296fc1c5193fa8c4511bda25da7379f9a
  name: ghcr.io/madfam-org/janua-website
  newName: ghcr.io/madfam-org/janua-website

patches:
- path: env-patch-api.yaml
  target:
    kind: Deployment
    name: janua-api
- path: hpa-disable-patch.yaml
  target:
    kind: HorizontalPodAutoscaler
