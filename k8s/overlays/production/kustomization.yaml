# Production overlay — canonical prod manifest set (RFC 0001 / PP.3b).
#
# ArgoCD watches this path (see infra/argocd/config.json). Image digests
# land here ONLY via promote-to-prod.yml — never from docker-publish.yml.
#
# Ops note: after this overlay lands, re-point the janua ArgoCD Application
# source path from k8s/base/deployments → k8s/overlays/production.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: janua

resources:
  - ../../base
  - kyverno-policy-exception.yaml
  - servicemonitor-janua-api.yaml

# Production image digests — seeded from the former k8s/base/deployments
# kustomization on PP.3b cutover. Updated exclusively by promote-to-prod.yml.
