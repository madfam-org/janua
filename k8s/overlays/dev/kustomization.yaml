apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: janua

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: development
    target:
      kind: Deployment
      name: janua-api
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: http://localhost:4100
    target:
      kind: Deployment
      name: janua-api
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/8/value
        value: "http://localhost:3000,http://localhost:4101,http://localhost:4200,http://localhost:4201"
    target:
      kind: Deployment
      name: janua-api
  # H9 (2026-04-23): re-enable Swagger UI / OpenAPI for local dev only.
  # The base default is "false" (prod-safe); flip it back on here so devs
  # still get /docs, /redoc, /openapi.json on localhost.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: janua-api
      spec:
        template:
          spec:
            containers:
              - name: janua-api
                env:
                  - name: ENABLE_DOCS
                    value: "true"
    target:
      kind: Deployment
      name: janua-api

# Images come from the base: ghcr.io/madfam-org/janua-*:main. To try a
# locally built image, load it into the local cluster (e.g. `kind load
# docker-image`) and override it here with `kustomize edit set image`.
