
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-factor authentication - Janua</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 28px; color: #333; margin-bottom: 8px; }
        .logo p { color: #666; font-size: 14px; }
        .app-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .app-info span { color: #666; font-size: 13px; }
        .app-info strong { color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; font-size: 14px; }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 4px;
            text-align: center;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .hint { color: #666; font-size: 13px; text-align: center; margin-top: 12px; }
        .error {
            background: #fee;
            color: #c00;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .footer { text-align: center; margin-top: 24px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>&#128274; Janua</h1>
            <p>Two-factor authentication</p>
        </div>

        <div class="app-info">
            <span>Signing in to <strong>Hotfix Check App</strong></span>
        </div>

        

        <form method="POST" action="/api/v1/auth/login-form/mfa">
            <input type="hidden" name="mfa_token" value="hotfix-check-token">
            <input type="hidden" name="auth_request_id" value="hotfix-check-request"><input type="hidden" name="client_id" value="hotfix-check"><input type="hidden" name="client_name" value="Hotfix Check App">
            <div class="form-group">
                <label for="code">Verification code</label>
                <input type="text" id="code" name="code" inputmode="text"
                       autocomplete="one-time-code" placeholder="123456"
                       required autofocus>
            </div>
            <button type="submit">Verify</button>
            <div class="hint">Enter the 6-digit code from your authenticator app, or a backup code.</div>
        </form>

        <div class="footer">Powered by Janua &bull; Secure Authentication</div>
    </div>
</body>
</html>
